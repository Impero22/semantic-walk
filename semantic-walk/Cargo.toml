[package]
name = "semantic-walk"
version = "0.1.0"
edition = "2021"

[dependencies]
semantic-combiner = { path = "../semantic-combiner" }
semantic-gate = { path = "../semantic-gate" }
serde = { version = "1", features = ["derive"] }

proptest = "1"
serde_json = "1.0"

npyz = { version = "0.9", features = ["npz"] }
zip = "2"

[dev-dependencies]
npyz = { version = "0.9", features = ["npz"] }
zip = "2"
